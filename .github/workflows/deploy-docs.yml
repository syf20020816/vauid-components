name: Deploy Docs

on:
  push:
    branches:
      - gh-pages
    paths:
      - 'docs/**'
      - 'components/**'
      - 'package.json'
      - '.dumirc.ts'
      - '.github/workflows/**'

jobs:
  deploy:
    # 避免 peaceiris/actions-gh-pages bot 推送到 gh-pages 后再次触发造成死循环
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN 默认只有 read 权限，需显式授予 write 才能推送 gh-pages
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build docs
        run: pnpm docs:build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-dist
          cname: docs.vauid-components.com
